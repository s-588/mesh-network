version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - goimports
    # - gofmt
    - gofumpt

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - govet
    # - revive
    - gocritic
    - misspell
    - unconvert
    - unused
    - gosec
    - gocyclo
    - funlen
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 100
      statements: 50
